{% extends 'base.html' %}

{% block content %}
<div class="card">
    <h2>Audit Logs</h2>
    <table>
        <thead><tr><th>User</th><th>Action</th><th>Details</th><th>Time</th></tr></thead>
        <tbody>
            {% for log in logs %}
            <tr><td>{{ log.user }}</td><td>{{ log.action }}</td><td>{{ log.details }}</td><td>{{ log.created_at }}</td></tr>
            {% empty %}<tr><td colspan="4">No logs.</td></tr>{% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
